<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
Smart Basket QR Scanner
</title>

<link
  rel="stylesheet"
  href="style.css">

<script
  src="https://unpkg.com/html5-qrcode">
</script>

</head>


<body>


<header class="topbar">

  <div class="brand">
    SMART BASKET TRACKER
  </div>

  <div class="brand-sub">
    By DIPROM
  </div>

</header>


<nav class="nav">

  <a
    href="index.html"
    class="active">
    Scan
  </a>

  <a
    href="qr-generator.html">
    QR Generator
  </a>

</nav>


<main class="container">


  <section class="hero">

    <div class="hero-title">
      Smart Basket QR Scanner
    </div>

    <div class="hero-text">
      Scan • Weigh • Track
    </div>

  </section>


  <section class="card">


    <div class="section-title">
      Transaction Information
    </div>


    <label>
      ผู้ใช้งาน
      <span>*</span>
    </label>

    <input
      id="user"
      type="text"
      placeholder="กรุณาระบุชื่อผู้ใช้งาน">


    <label>
      Location
      <span>*</span>
    </label>

    <input
      id="location"
      type="text"
      placeholder="เช่น Warehouse">


    <label>
      Action
      <span>*</span>
    </label>

    <select id="action">

      <option value="">
        -- กรุณาเลือก --
      </option>

      <option value="IN">
        IN — รับเข้า
      </option>

      <option value="OUT">
        OUT — นำออก
      </option>

    </select>


    <label>
      น้ำหนัก (kg)
      <span>*</span>
    </label>

    <input
      id="weight"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="เช่น 12.50">


    <button
      id="startBtn"
      class="primary-btn">

      📷 เปิดกล้องและสแกน QR

    </button>


    <div
      id="error"
      class="error">
    </div>


  </section>


  <section
    id="scannerCard"
    class="card hidden">

    <div class="scanner-title">
      Scan Basket QR Code
    </div>

    <div id="reader"></div>

  </section>


  <section
    id="result"
    class="result hidden">
  </section>


</main>


<footer>

  SMART BASKET TRACKER
  By DIPROM

</footer>


<script
  src="script.js">
</script>


</body>

</html>
